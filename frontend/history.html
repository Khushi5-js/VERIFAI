<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERIFAI | Forensic Case Archive & History</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .case-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.5rem;
    }
    .case-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--border-subtle);
      transition: var(--transition-fast);
      position: relative;
      overflow: hidden;
    }
    .case-card:hover {
      transform: translateY(-2px);
      border-color: rgba(6, 182, 212, 0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .case-card-thumb {
      height: 180px;
      background: #000;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .case-card-thumb img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div style="display: flex; align-items: center; gap: 0.85rem;">
      <button class="btn-nav-entry" onclick="navigateBack('index.html#app')" title="Go to previous page">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span>Back</span>
      </button>

      <a href="index.html" class="brand">
        <div class="brand-shield">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <span>VERIFAI</span>
      </a>
    </div>

    <ul class="nav-links">
      <li><a href="index.html#app" class="nav-link">Workbench</a></li>
      <li><a href="scoreboard.html" class="nav-link">Scoreboard</a></li>
      <li><a href="history.html" class="nav-link active">Case History</a></li>
    </ul>

    <div class="status-pill">
      <div class="status-dot"></div>
      <span id="history-total-pill">ARCHIVE READY</span>
    </div>
  </nav>

  <main class="container">
    
    <!-- Header -->
    <header class="hero" style="margin-bottom: 2rem;">
      <div class="hero-badge">DIGITAL CHAIN OF CUSTODY LOG</div>
      <h1 class="hero-title" style="font-size: 2.5rem;">Forensic Case Archive</h1>
      <p class="hero-subtitle">
        Searchable record of past investigations. Reopen full 8-stage evidence trails, ELA differentials, and write-ups anytime.
      </p>
    </header>

    <!-- Filters Bar -->
    <div class="glass-panel" style="margin-bottom: 2rem; padding: 1.25rem 1.75rem;">
      <div style="display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap;">
        
        <!-- Search Input -->
        <div style="display: flex; align-items: center; gap: 0.5rem; background: rgba(0,0,0,0.3); border: 1px solid var(--border-subtle); padding: 0.5rem 1rem; border-radius: var(--radius-sm); min-width: 320px; flex: 1;">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" id="history-search" placeholder="Search archive by Case ID, filename, SHA256..." style="background: transparent; border: none; outline: none; color: #fff; width: 100%; font-size: 0.88rem; font-family: var(--font-sans);">
        </div>

        <!-- Filter Tier Select -->
        <select id="filter-tier" style="background: rgba(13, 19, 34, 0.9); color: var(--text-primary); border: 1px solid var(--border-subtle); padding: 0.55rem 0.85rem; border-radius: var(--radius-sm); font-size: 0.88rem; outline: none;">
          <option value="ALL">All Risk Tiers</option>
          <option value="AUTHENTIC">Authentic (0-25)</option>
          <option value="SUSPICIOUS">Suspicious (26-65)</option>
          <option value="HIGH_RISK">High Risk (66-85)</option>
          <option value="FABRICATED">Fabricated (86-100)</option>
        </select>

        <!-- Filter Type Select -->
        <select id="filter-type" style="background: rgba(13, 19, 34, 0.9); color: var(--text-primary); border: 1px solid var(--border-subtle); padding: 0.55rem 0.85rem; border-radius: var(--radius-sm); font-size: 0.88rem; outline: none;">
          <option value="ALL">All File Formats</option>
          <option value="image">Images</option>
          <option value="pdf">PDF Documents</option>
        </select>

      </div>
    </div>

    <!-- Case Archive Cards Grid -->
    <div class="case-card-grid" id="history-grid">
      <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem;">
        Loading archive records...
      </div>
    </div>

  </main>

  <script src="history.js"></script>
</body>
</html>
